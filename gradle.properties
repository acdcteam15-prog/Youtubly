org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# Never let Gradle fetch a JDK on its own: CI installs one, and a local JAVA_HOME works too.
org.gradle.java.installations.auto-download=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Repository that the in-app updater checks for new releases ("owner/repo").
# GitHub Actions overrides this automatically with the repository the build runs in,
# so you only need to set it here for builds made on your own PC.
updateRepo=CHANGE_ME/Youtubly
