# Builds and tests on every push / pull request. Nothing is published; the APK is attached to the run.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3   # accepts the licences; Gradle downloads the SDK platform it needs
        with:
          packages: platform-tools

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v6   # also validates gradle-wrapper.jar

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: youtubly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
