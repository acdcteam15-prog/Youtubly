# Builds the debug APK when Rebuild-APK.bat asks for it. Nothing is published; the APK is attached to the run (Artifacts).
name: Build
on:
  workflow_dispatch:   # started by Rebuild-APK.bat (or the "Run workflow" button on GitHub)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libzt:
    uses: ./.github/workflows/libzt.yml

  app:
    needs: libzt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: libzt-aar
          path: app/libs

      - name: Where did the ZeroTier library land?
        run: |
          find . -name '*.aar' -not -path './.git/*' -print
          test -n "$(find . -name 'libzt-release.aar' -not -path './.git/*')" || { echo "::error::libzt-release.aar was not downloaded"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: remoty-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7
