# Builds the SIGNED release APK and publishes it as a GitHub Release. The in-app updater (Laptop tab) reads it.
# Run: Actions > Release > Run workflow   (needs the 4 signing secrets, see README).
name: Release
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown on the release). Empty = commit list."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  libzt:
    uses: ./.github/workflows/libzt.yml

  release:
    needs: libzt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: libzt-aar
          path: app/libs

      - name: Where did the ZeroTier library land?
        run: |
          find . -name '*.aar' -not -path './.git/*' -print
          test -n "$(find . -name 'libzt-release.aar' -not -path './.git/*')" || { echo "::error::libzt-release.aar was not downloaded"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Without a fixed signing key, updates cannot install over the previous version."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        id: pack
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          OFFSET=$(grep '^versionCodeOffset=' version.properties | cut -d= -f2 | tr -d '\r')
          CODE=$((OFFSET + ${{ github.run_number }}))
          NAME="Remoty-${VERSION_NAME//./_}-build${CODE}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "run=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "${INPUT_NOTES:-}" ]; then printf '%s\n' "$INPUT_NOTES" > notes.md
          else git log -20 --no-merges --pretty='- %s' > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.pack.outputs.run }}
          name: Remoty ${{ steps.pack.outputs.version }} (build ${{ steps.pack.outputs.run }})
          body_path: notes.md
          files: dist/${{ steps.pack.outputs.name }}
          make_latest: true
