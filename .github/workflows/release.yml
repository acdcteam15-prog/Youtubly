# Builds the signed release APK and publishes it as a GitHub Release.
# The in-app updater (Settings -> Updates) reads the latest release of this repository.
#
# Run it from the Actions tab -> "Release" -> "Run workflow"  (or push a tag like v1.2.0).
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app's update screen). Leave empty to use the commit list."
        required: false
        type: string
      required:
        description: 'Mark as a required update (the app asks to install it straight away)'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3   # accepts the licences; Gradle downloads the SDK platform it needs
        with:
          packages: platform-tools

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v5

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Run START-HERE.bat and choose 3, otherwise updates could not be installed over the previous version."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK and write checksum
        id: pack
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '\r')
          OFFSET=$(grep '^versionCodeOffset=' version.properties | cut -d= -f2 | tr -d '\r')
          CODE=$((OFFSET + ${{ github.run_number }}))
          NAME="Youtubly-${VERSION_NAME//./_}-build${CODE}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Small updates: for each of the newest published builds, a patch that turns THAT apk into this one. A phone
      # then downloads a few MB instead of the whole file. Failure here never blocks the release: the full APK is
      # always published too, and the app falls back to it by itself.
      - name: Small-update patches
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_CODE: ${{ steps.pack.outputs.code }}
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq bsdiff
          NEW="dist/${{ steps.pack.outputs.name }}"
          mkdir -p prev
          for TAG in $(gh release list --limit 3 --exclude-drafts --json tagName --jq '.[].tagName'); do
            rm -f prev/*.apk prev/raw.patch
            gh release download "$TAG" --pattern '*-build*.apk' --dir prev || { echo "skip $TAG"; continue; }
            OLD=$(ls prev/*.apk | head -1)
            FROM=$(basename "$OLD" | sed -n 's/.*-build\([0-9][0-9]*\)\.apk$/\1/p')
            if [ -z "$FROM" ] || [ "$FROM" = "$NEW_CODE" ]; then continue; fi
            echo "Patch from build $FROM to build $NEW_CODE"
            if bsdiff "$OLD" "$NEW" prev/raw.patch && python3 scripts/ci/make_patch.py "$OLD" "$NEW" prev/raw.patch "dist/Youtubly-patch-from${FROM}-to${NEW_CODE}.ytpatch"; then
              :
            else
              echo "::warning::could not make the patch from build $FROM (the full APK is still published)"
            fi
          done
          ls -la dist

      - name: Verify the APK is signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/${{ steps.pack.outputs.name }}" | head -5

      - name: Release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_REQUIRED: ${{ inputs.required }}
        run: |
          {
            if [ -n "${INPUT_NOTES:-}" ]; then
              printf '%s\n' "$INPUT_NOTES"
            else
              PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-20"; fi
              git log $RANGE --no-merges --pretty='- %s' | head -30
            fi
            if [ "${INPUT_REQUIRED:-false}" = "true" ]; then printf '\n[required]\n'; fi
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.pack.outputs.code }}
          name: Youtubly ${{ steps.pack.outputs.version }} (build ${{ steps.pack.outputs.code }})
          body_path: notes.md
          files: |
            dist/${{ steps.pack.outputs.name }}
            dist/${{ steps.pack.outputs.name }}.sha256
            dist/*.ytpatch
          make_latest: true
