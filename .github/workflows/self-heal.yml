# Keeps YouTube playback working by itself.
#
# YouTube changes its pages from time to time and the app breaks until its extractor library (NewPipeExtractor) is
# updated. Every day this job looks for a newer release, builds the app with it, runs the tests and a live check
# against YouTube, and - if all is well - commits the new version and starts a release. Your phone then finds the
# release through Settings > App updates (it downloads on Wi-Fi; you still tap Install).
name: Self-heal YouTube

on:
  schedule:
    - cron: '17 5 * * *'      # every day, 05:17 UTC
  workflow_dispatch:

concurrency:
  group: self-heal
  cancel-in-progress: false

permissions:
  contents: write    # commit the new version
  issues: write      # report when it cannot be updated
  actions: write     # start the release workflow

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew scripts/ci/newpipe.sh

      - uses: gradle/actions/setup-gradle@v5

      - name: Look for a newer NewPipeExtractor
        id: ver
        run: |
          CURRENT=$(scripts/ci/newpipe.sh current)
          LATEST=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if scripts/ci/newpipe.sh newer "$CURRENT" "$LATEST"; then echo "newer=true" >> "$GITHUB_OUTPUT"; else echo "newer=false" >> "$GITHUB_OUTPUT"; fi
          echo "In use: $CURRENT   Latest: $LATEST"

      # 1) Does YouTube work with the version we ship now?
      - name: Live check with the current version
        id: before
        continue-on-error: true
        env:
          LIVE_TESTS: '1'
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*LiveExtractionTest*'

      # 2) Try the newer version: it must compile and pass every test.
      - name: Switch to the newer version
        if: steps.ver.outputs.newer == 'true'
        run: scripts/ci/newpipe.sh set "${{ steps.ver.outputs.latest }}"

      - name: Build and run the tests with the newer version
        id: unit
        if: steps.ver.outputs.newer == 'true'
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # 3) And the live check again.
      - name: Live check with the newer version
        id: after
        if: steps.ver.outputs.newer == 'true' && steps.unit.outcome == 'success'
        continue-on-error: true
        env:
          LIVE_TESTS: '1'
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests '*LiveExtractionTest*'

      # Decide. GitHub's servers are sometimes refused by YouTube even when phones are fine, so "the live check fails
      # with BOTH versions" is not held against the new one. Only "worked before, broken now" blocks an update.
      - name: Decide
        id: decide
        run: |
          NEWER='${{ steps.ver.outputs.newer }}'
          UNIT='${{ steps.unit.outcome }}'
          BEFORE='${{ steps.before.outcome }}'
          AFTER='${{ steps.after.outcome }}'
          if [ "$NEWER" != "true" ]; then
            echo "decision=none" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" != "success" ]; then
            echo "decision=reject" >> "$GITHUB_OUTPUT"; echo "reason=the app does not build or its tests fail with the new version" >> "$GITHUB_OUTPUT"
          elif [ "$BEFORE" = "success" ] && [ "$AFTER" != "success" ]; then
            echo "decision=reject" >> "$GITHUB_OUTPUT"; echo "reason=YouTube worked with the current version but not with the new one" >> "$GITHUB_OUTPUT"
          else
            echo "decision=update" >> "$GITHUB_OUTPUT"
            if [ "$AFTER" = "success" ]; then echo "note=live check passed" >> "$GITHUB_OUTPUT"; else echo "note=live check inconclusive from GitHub's servers" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Commit the new version and start a release
        if: steps.decide.outputs.decision == 'update'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "Update NewPipeExtractor ${{ steps.ver.outputs.current }} -> ${{ steps.ver.outputs.latest }} (YouTube fixes)"
          git push
          gh workflow run release.yml --ref main -f notes="YouTube fixes: NewPipeExtractor ${{ steps.ver.outputs.current }} -> ${{ steps.ver.outputs.latest }} (automatic, ${{ steps.decide.outputs.note }})."

      - name: Tell me when a newer version cannot be used
        if: steps.decide.outputs.decision == 'reject'
        run: |
          TITLE="NewPipeExtractor ${{ steps.ver.outputs.latest }} was not installed"
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$N" = "0" ]; then
            gh issue create --title "$TITLE" --body "The daily check found ${{ steps.ver.outputs.latest }} but did not install it because ${{ steps.decide.outputs.reason }}. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Tell me when YouTube is failing and no fix exists yet
        if: steps.ver.outputs.newer != 'true' && steps.before.outcome != 'success'
        run: |
          TITLE="YouTube check failing with NewPipeExtractor ${{ steps.ver.outputs.current }}"
          N=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$N" = "0" ]; then
            gh issue create --title "$TITLE" --body "The daily live check could not get a stream from YouTube and there is no newer extractor yet. It can also mean GitHub's servers are being refused: if playback works on your phone, close this. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
