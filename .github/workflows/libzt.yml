# Builds the ZeroTier Sockets library (libzt) for Android from source, once, and caches it.
# The Remoty app embeds it so the phone can join your ZeroTier network by itself (no ZeroTier app, no VPN slot).
name: Build libzt
on:
  workflow_call:
  workflow_dispatch:

env:
  LIBZT_REPO: zerotier/libzt
  LIBZT_REF: a707ea6ae0910efdc1125d04758c411e2e9ea4f9   # pinned commit; bump deliberately

jobs:
  libzt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: libzt-release.aar
          key: libzt-aar-${{ env.LIBZT_REF }}

      - uses: actions/checkout@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: ${{ env.LIBZT_REPO }}
          ref: ${{ env.LIBZT_REF }}
          submodules: recursive
          path: libzt

      - uses: actions/setup-java@v5      # libzt's own Gradle project (AGP 7.3 / Gradle 7.5) needs JDK 17, not 21
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          packages: platform-tools   # the action's default ("tools") does not exist any more and fails the job

      - name: Install the SDK pieces libzt asks for
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Build the AAR
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: libzt/pkg/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/aar/libzt-release.aar "$GITHUB_WORKSPACE/libzt-release.aar"

      - uses: actions/upload-artifact@v5
        with:
          name: libzt-aar
          path: libzt-release.aar
          retention-days: 30
